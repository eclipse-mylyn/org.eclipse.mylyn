    - name: Add remote "ubuntu" user to "docker" group
      ansible.builtin.user:
        name: "ubuntu"
        groups: "docker"
        append: true

    - name: Creates directory
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - /mylyn-config-dir
        - /mylyn-runtime-dir

